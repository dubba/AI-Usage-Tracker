<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="opt1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161726" />
      <stop offset="50%" stop-color="#0e0f1a" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="opt1-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d75" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a1b2e" stop-opacity="0.3" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="opt1-outer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Middle Ring Gradient -->
    <linearGradient id="opt1-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Center Spark Gradient -->
    <linearGradient id="opt1-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="opt1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="opt1-radial" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Bleed Squircle Base (fills canvas, transparent rounded corners) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#opt1-bg)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="url(#opt1-border)" stroke-width="3" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#opt1-radial)" />

  <!-- Outer Telemetry Ring Track (Inactive) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1f2238" stroke-width="15" stroke-dasharray="10 8" opacity="0.6" />
  <!-- Outer Telemetry Ring (Active Gauge: 270 deg) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#opt1-outer)" stroke-width="15"
          stroke-linecap="round" stroke-dasharray="791 1055" stroke-dashoffset="131"
          transform="rotate(-90 256 256)" filter="url(#opt1-glow)" />

  <!-- Middle Telemetry Ring Track -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#1f2238" stroke-width="11" opacity="0.5" />
  <!-- Middle Ring (Active 180 deg) -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="url(#opt1-mid)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="470 779" stroke-dashoffset="105"
          transform="rotate(45 256 256)" />

  <!-- Orbiting Telemetry Indicator Nodes -->
  <circle cx="424" cy="256" r="8.5" fill="#c084fc" filter="url(#opt1-glow)" />
  <circle cx="256" cy="132" r="6.5" fill="#38bdf8" />
  
  <!-- Subtle Gauge Tick Marks -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#2e3252" stroke-width="3.5" stroke-dasharray="4 16" opacity="0.7" />

  <!-- AI Intelligence Spark (Four-Point Star) -->
  <g transform="translate(256, 256)" filter="url(#opt1-glow)">
    <path d="M 0,-58 Q 0,-6 -52,0 Q 0,6 0,58 Q 0,6 52,0 Q 0,-6 0,-58 Z" fill="url(#opt1-spark)" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="8.5" fill="#ffffff" />
  </g>
</svg>
