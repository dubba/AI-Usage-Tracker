[package]
name = "ai-usage-tracker"
version = "0.5.2"
description = "Standalone multi-provider AI usage monitor and optional Paseo integration"
authors = ["AI Usage Tracker contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.48", default-features = false }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
if-addrs = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
mdns-sd = "0.13"
miniz_oxide = "0.8"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# 2.12 is the first release whose iOS window layer supports the scene life cycle that
# Info.ios.plist opts into, which apps built with the iOS 27 SDK require.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# `zip` is a default feature, and it is the only reason zip 4.6.1 is in the
# tree. cargo audit rejects that crate (RUSTSEC-2026-0367, 0368, 0369). The
# feature only unpacks Tauri v1 .zip updater bundles and Linux AppImage
# tarballs. Windows updates are NSIS installers, and macOS updates use tar,
# which the plugin builds without this feature.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2.4.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Apple Keychain services for credential cleanup on fresh installs.
# The same version keyring already pulls in.
security-framework = "3"

# WebKit's cookie store without blocking the main thread (src/ios_cookies.rs) and
# sign-in popups (src/ios_popups.rs).
# The same versions wry already pulls in.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSGeometry", "NSHTTPCookie", "NSObject", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKHTTPCookieStore", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(windows)'.dependencies]
# Quotes the start-at-login command (src/autostart.rs). The same version
# tauri-plugin-autostart already pulls in through auto-launch.
winreg = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units defaults to 16 so LLVM parallelizes across runner CPU cores;
# ThinLTO still performs cross-module inlining and dead code elimination.
strip = true

# A trimmed copy of tauri-plugin-notification with one Swift fix: tapping a notification after
# iOS terminated the app crashed it (https://github.com/tauri-apps/plugins-workspace/issues/3533).
# See vendor/tauri-plugin-notification/VENDORED.md for what changed and when to drop it.
[patch.crates-io]
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
