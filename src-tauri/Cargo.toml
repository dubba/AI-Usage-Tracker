[package]
name = "ai-usage-tracker"
version = "0.7.0"
description = "Standalone multi-provider AI usage monitor and optional Paseo integration"
authors = ["AI Usage Tracker contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `usage-core` holds the data model and the rules about it without Tauri, so its tests build in
# seconds. The notification plugin under `vendor/` is a patched dependency, not a member.
[workspace]
members = ["crates/usage-core"]
exclude = ["vendor/tauri-plugin-notification"]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.48", default-features = false }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# Derives the key of a Sync Devices transfer file from its link code (pairing/file_transfer.rs):
# the file can be tested offline, so each guess must be slow and memory-hard.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
if-addrs = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
mdns-sd = "0.13"
miniz_oxide = "0.8"
parking_lot = "0.12"
# Only the module grid (pairing/transport/qr.rs); the frontend draws the code, so no renderer.
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Password-authenticated key exchange for link-code pairing (pairing/crypto.rs): the six-digit
# code proves both devices are the ones the user is holding. Its dependencies (curve25519-dalek,
# hkdf, sha2, rand_core) are already in the tree.
spake2 = "0.4"
subtle = "2"
# 2.12 is the first release whose iOS window layer supports the scene life cycle that
# Info.ios.plist opts into, which apps built with the iOS 27 SDK require.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# `zip` is a default feature, and it is the only reason zip 4.6.1 is in the
# tree. cargo audit rejects that crate (RUSTSEC-2026-0367, 0368, 0369). The
# feature only unpacks Tauri v1 .zip updater bundles and Linux AppImage
# tarballs. Windows updates are NSIS installers, and macOS updates use tar,
# which the plugin builds without this feature.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The updater plugin's HTTP client is reqwest 0.13, not the 0.12 used elsewhere. This names that
# version only to build the plugin's redirect policy (`configure_client`); the plugin already
# compiles it, so no new code is built.
reqwest_updater = { package = "reqwest", version = "0.13", default-features = false }
tauri-plugin-window-state = "2.4.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
usage-core = { path = "crates/usage-core" }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
# The share menu for transfer files (platform/share_sheet.rs). The same versions tao already
# pulls in.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSGeometry", "NSObject", "NSString", "NSURL"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Apple Keychain services for credential cleanup on fresh installs.
# The same version keyring already pulls in.
security-framework = "3"

# WebKit's cookie store without blocking the main thread (src/ios_cookies.rs) and
# sign-in popups (src/ios_popups.rs).
# The same versions wry already pulls in.
[target.'cfg(target_os = "ios")'.dependencies]
# Keychain accessibility for the background refresh (store/credentials/keychain_access.rs).
# The same version security-framework already pulls in.
core-foundation = "0.10"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSData", "NSError", "NSGeometry", "NSHTTPCookie", "NSObject", "NSString", "NSURL"] }
# The share sheet for Sync Devices transfer files (platform/share_sheet.rs) and the one-time
# Downloads folder picker (platform/ios_files.rs). The same versions tao already pulls in.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIActivity", "UIActivityViewController", "UIDocumentPickerViewController", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKHTTPCookieStore", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(windows)'.dependencies]
# Quotes the start-at-login command (src/autostart.rs). The same version
# tauri-plugin-autostart already pulls in through auto-launch.
winreg = "0.10"
# Lists and deletes the app's Credential Manager entries on uninstall (src/store/credentials/
# uninstall.rs). The same version keyring already pulls in.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
# The share panel for transfer files (src/platform/share_sheet/windows.rs). The same versions
# tauri already pulls in.
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_UI_Shell"] }
windows-collections = "0.3"

[dev-dependencies]
# Generates the TypeScript types the frontend uses for backend values (`src/types.generated.ts`,
# written by `type_contract.rs`). Test-only: the derives are `cfg_attr(test, ...)`, so release
# builds never compile it.
ts-rs = "12"
usage-core = { path = "crates/usage-core", features = ["test-util", "ts"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
# codegen-units defaults to 16 so LLVM parallelizes across runner CPU cores;
# ThinLTO still performs cross-module inlining and dead code elimination.
strip = true

# A trimmed copy of tauri-plugin-notification with one Swift fix: tapping a notification after
# iOS terminated the app crashed it (https://github.com/tauri-apps/plugins-workspace/issues/3533).
# See vendor/tauri-plugin-notification/VENDORED.md for what changed and when to drop it.
[patch.crates-io]
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
