name: Validate

on:
  # Not run on push: scripts/preflight.sh covers that locally, and the release
  # workflow calls this as its gate on the exact commit it is about to ship.
  pull_request:
  workflow_call:

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (see comments for the moving tag each
      # SHA was resolved from) so a compromised tag cannot inject CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      # Release scripts sit outside tsc/oxlint (both target src/ only), so
      # these suites are their only guard.
      - run: npm run test:resolve-version
      - run: npm run test:release-notes
      - run: npm run test:sidestore-source
      - run: npm run test:updater-manifest
      - run: npm run test:gemini-quota-probe
      - run: npm run test:workflows
      - run: npm run build
      - name: Publish frontend validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/frontend" \
            -f description="Frontend type-check, tests, and production build"

  dependency-audit:
    runs-on: ubuntu-latest
    # audit-check reports its findings as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main: v2.0.0 + Node 24 (#48), untagged
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  rust-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Debug and release compile different credential-storage code (release
      # uses the OS keychain), so lint both.
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --release --all-targets -- -D warnings
      - name: Publish Rust lint status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/rust-lint" \
            -f description="rustfmt and clippy (-D warnings), debug and release"

  desktop-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build
      - name: Run Rust unit tests
        shell: bash
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          if [ "$RUNNER_OS" = "Windows" ]; then
            find src-tauri/target/debug -name "*.dll" -exec cp -f {} src-tauri/target/debug/deps/ \; 2>/dev/null || true
          fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated native icons
        shell: bash
        run: |
          test -s src-tauri/icons/icon.png
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/icon.icns
      - name: Publish desktop validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/desktop-${TARGET_OS}" \
            -f description="Rust tests, checks, and native icon generation on ${TARGET_OS}"

  # The iOS and Android code (WebView sign-in, cookie reset, JNI bridge) is
  # compiled nowhere else until a release build, so a mobile-only break would
  # land on main unnoticed. These jobs only compile the library for each
  # target; nothing runs, because there is no device or emulator here.
  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib
      - name: Publish iOS compile status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/ios-compile" \
            -f description="Rust library compiles for aarch64-apple-ios"

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # The same NDK the release build uses (build-android.yml).
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - name: Check the library compiles for Android
        shell: bash
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Build scripts of C dependencies compile with the NDK's clang.
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --lib
      - name: Publish Android compile status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then state="error"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="validate/android-compile" \
            -f description="Rust library compiles for aarch64-linux-android"
