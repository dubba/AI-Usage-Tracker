name: Validate

on:
  # Not run on push: scripts/preflight.sh covers that locally, and the release
  # workflow calls this as its gate on the exact commit it is about to ship.
  pull_request:
  workflow_call:

# Read-only. Each job shows up as a native GitHub check, so the jobs need no
# write token: pull-request code runs here and must not be able to forge a
# passing status (L-80). Checkouts keep no token in .git/config either.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (see comments for the moving tag each
      # SHA was resolved from) so a compromised tag cannot inject CI code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Gate shipped app dependencies; dev-only tooling (Vite/Vitest) is not bundled.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      # Release scripts sit outside tsc/oxlint (both target src/ only), so
      # these suites are their only guard.
      - run: npm run test:resolve-version
      - run: npm run test:release-notes
      - run: npm run test:sidestore-source
      - run: npm run test:updater-manifest
      - run: npm run test:gemini-quota-probe
      - run: npm run test:windows-uninstall
      - run: npm run test:macos-uninstall
      - run: npm run test:workflows
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    # audit-check reports its findings as a check run, and on scheduled runs
    # (the release gate) opens an issue for each advisory it reports as a warning,
    # which needs issues: write; without it the job failed after a clean audit.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main: v2.0.0 + Node 24 (#48), untagged
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Warnings (not vulnerabilities) for crates that Tauri's Linux stack pulls in
          # and that this repo cannot replace: proc-macro-error, glib, and the zbus
          # family (zbus_names, zvariant, zvariant_derive). A new advisory still
          # opens an issue.
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0429,RUSTSEC-2026-0370,RUSTSEC-2026-0371,RUSTSEC-2026-0372

  rust-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Debug and release compile different credential-storage code (release
      # uses the OS keychain), so lint both.
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --release --all-targets -- -D warnings

  desktop-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # No debug info for the test build: nothing debugs it here, and failures still
    # report file and line (they come from the panic, not debug info). Measured on
    # a Mac, the cold build is 5% faster and its output 30% smaller, so the cache
    # this job saves and restores shrinks too. Only this job sets it, because it
    # is part of the cache key and the check-only jobs produce no debug info.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows runner exclusions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ExclusionPath @((Get-Location).Path, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build
      - name: Run Rust unit tests
        shell: bash
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          if [ "$RUNNER_OS" = "Windows" ]; then
            find src-tauri/target/debug -name "*.dll" -exec cp -f {} src-tauri/target/debug/deps/ \; 2>/dev/null || true
          fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      # The non-test build of the library and the binary. rust-lint's
      # clippy --all-targets already compiles both on macOS, so only Windows
      # needs it; nothing else compiles Windows' non-test code before a release.
      - if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated native icons
        shell: bash
        run: |
          test -s src-tauri/icons/icon.png
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/icon.icns

  # The iOS and Android code (WebView sign-in, cookie reset, JNI bridge) is
  # compiled nowhere else until a release build, so a mobile-only break would
  # land on main unnoticed. These jobs only compile the library for each
  # target; nothing runs, because there is no device or emulator here.
  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # The same NDK the release build uses (build-android.yml).
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the built frontend at compile time.
      - run: npm ci
      - run: npm run build
      - name: Check the library compiles for Android
        shell: bash
        run: |
          set -euo pipefail
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Build scripts of C dependencies compile with the NDK's clang.
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --lib
