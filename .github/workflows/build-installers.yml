name: Publish all platform releases

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if no new commits exist"
        type: boolean
        required: false
        default: false
      include_apple:
        description: "Include macOS and iOS builds"
        type: boolean
        required: false
        default: true
  # Thursdays & Sundays @ 11:59 PM EST, all platforms on both runs.
  # Thursday 11:59 PM EST -> Friday 04:59 UTC
  # Sunday 11:59 PM EST -> Monday 04:59 UTC
  schedule:
    - cron: '59 4 * * 5' # Thursdays @ 11:59 PM EST (Friday 04:59 UTC)
    - cron: '59 4 * * 1' # Sundays @ 11:59 PM EST (Monday 04:59 UTC)
  push:
    branches: [main]
    paths:
      - .github/release-trigger

permissions:
  contents: write

jobs:
  check-changes:
    name: Check commits and determine target platforms
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_apple: ${{ steps.check.outputs.build_apple }}
      version: ${{ steps.version.outputs.version }}
      is_beta: ${{ steps.version.outputs.is_beta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # fetch all tags and history to compare
      - name: Inspect commits and schedule day
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force }}
          INPUT_APPLE: ${{ inputs.include_apple }}
        run: |
          set -euo pipefail

          # Every release builds every platform. A release is tagged at HEAD, so
          # a run that skipped the Apple platforms would leave that version
          # without macOS and iOS builds (and without their updater entries)
          # until a later commit arrives. Only a manual run may opt out.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_APPLE="${INPUT_APPLE:-true}"
          else
            BUILD_APPLE="true"
          fi

          echo "build_apple=$BUILD_APPLE" >> "$GITHUB_OUTPUT"
          echo "Target platforms will include macOS/iOS: $BUILD_APPLE"

          if [ "${FORCE_BUILD:-false}" = "true" ]; then
            echo "Build manually forced via workflow_dispatch input."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Build triggered by explicit push to .github/release-trigger."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found in repository; proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_COMMIT=$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null || true)
          HEAD_COMMIT=$(git rev-parse HEAD)

          echo "Latest release tag: $LATEST_TAG ($RELEASE_COMMIT)"
          echo "Current HEAD commit: $HEAD_COMMIT"

          if [ -n "$RELEASE_COMMIT" ] && [ "$RELEASE_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "No new commits since $LATEST_TAG. Skipping build to save credits."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The release pipeline itself pushes follow-up commits to main (the
          # SideStore source update and the released version bump). They are
          # not new work, so they must not trigger another release.
          COMMITS_COUNT=$(git rev-list --count --invert-grep \
            --grep='^chore(release): bump version to ' \
            --grep='^chore: update SideStore source for v' \
            "${LATEST_TAG}..HEAD" 2>/dev/null || echo "1")
          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "Zero commits between $LATEST_TAG and HEAD. Skipping build to save credits."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $COMMITS_COUNT new commit(s) since $LATEST_TAG. Proceeding with release build."
          echo "should_build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.check.outputs.should_build == 'true'
        with:
          node-version: 22
      - name: Resolve release version and beta fallback
        id: version
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/resolve-release-version.mjs --github-output

  publish-windows:
    name: Build Windows installer
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Apply release version
        run: |
          node scripts/resolve-release-version.mjs --version "${{ needs.check-changes.outputs.version }}" --apply
      - name: Detect beta version
        id: release_kind
        shell: python
        run: |
          import json
          import os

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as config_file:
              version = json.load(config_file)["version"]
          is_beta = "-" in version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"is_beta={'true' if is_beta else 'false'}\n")
      - name: Normalize and verify updater signing key
        shell: python
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64
          import os
          import sys

          raw_key = os.environ.get("RAW_TAURI_SIGNING_PRIVATE_KEY", "")
          normalized_key = "".join(raw_key.lstrip("﻿").split())

          if normalized_key:
              try:
                  decoded = base64.b64decode(normalized_key, validate=True).decode("utf-8")
                  if "secret key" in decoded.lower():
                      print(f"::add-mask::{normalized_key}")
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                          env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={normalized_key}\n")
                  else:
                      print("Warning: TAURI_SIGNING_PRIVATE_KEY does not contain a Tauri updater private key.")
              except Exception as error:
                  print(f"Warning: TAURI_SIGNING_PRIVATE_KEY is not valid Base64: {error}")
          else:
              print("Notice: TAURI_SIGNING_PRIVATE_KEY not set; building unsigned release artifacts.")
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: AI Usage Tracker v__VERSION__
          releaseBody: |
            ## Which download should I use?

            ### Windows

            **Recommended for most people: download the file ending in `-setup.exe`.**

            - **`-setup.exe` — recommended:** the normal Windows installer. It installs for your Windows account, usually does not require administrator access, and is the installer used by automatic in-app updates.
            - **`.msi` — administrators and managed computers:** intended for enterprise deployment, system administrators, Group Policy, Intune, or machine-wide installation. It commonly requires administrator access.

            ### macOS

            - **Apple Silicon:** choose the macOS download marked `aarch64` or `arm64` for M1, M2, M3, M4, and newer Apple chips.
            - **Intel Mac:** choose the macOS download marked `x64` or `x86_64`.

            ### Android

            - **`.apk` — sideload for Android:** download the `.apk` file directly to your phone (or transfer via USB) and tap to install. Enable "Install unknown apps" for your browser or file manager when prompted.

            ### iOS (SideStore)

            - **`.ipa` — sideload for iPhone/iPad:** add the `sidestore-source.json` URL to SideStore sources or download the `.ipa` to install and re-sign via SideStore.

            ### Files you normally should not download manually

            Files ending in `.sig`, `.tar.gz`, and `latest.json` support automatic updates. They are not the normal installers.
          releaseDraft: false
          prerelease: ${{ steps.release_kind.outputs.is_beta == 'true' }}
          uploadUpdaterJson: true
          args: ${{ steps.release_kind.outputs.is_beta == 'true' && '--bundles nsis' || '' }}

  # Releases are numbered from the tags, not from package.json, so a released
  # version is bumped automatically (0.4.1 -> 0.4.2). Write the number that
  # shipped back to the version files so package.json on main matches the
  # latest release. Failing to push does not fail the release: the next run
  # derives its version from the tags either way.
  commit-version-bump:
    name: Commit released version to main
    needs: [check-changes, publish-windows]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Write the released version back to the version files
        shell: bash
        env:
          VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/resolve-release-version.mjs --version "$VERSION" --apply
          if git diff --quiet; then
            echo "Version files already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to $VERSION"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed version bump to $VERSION."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::warning::Could not push the version bump for $VERSION. Releases still number from tags."

  build-android:
    name: Build Android APK
    needs: [check-changes, publish-windows]
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      attach_to_versioned_release: true
      release_version: ${{ needs.check-changes.outputs.version }}

  publish-macos:
    name: Build macOS desktop
    needs: [check-changes, publish-windows]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_apple == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Apply release version
        run: |
          node scripts/resolve-release-version.mjs --version "${{ needs.check-changes.outputs.version }}" --apply
      - name: Detect beta version
        id: release_kind
        shell: python
        run: |
          import json
          import os

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as config_file:
              version = json.load(config_file)["version"]
          is_beta = "-" in version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"is_beta={'true' if is_beta else 'false'}\n")
      - name: Normalize and verify updater signing key
        shell: python
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64
          import os
          import sys

          raw_key = os.environ.get("RAW_TAURI_SIGNING_PRIVATE_KEY", "")
          normalized_key = "".join(raw_key.lstrip("﻿").split())

          if normalized_key:
              try:
                  decoded = base64.b64decode(normalized_key, validate=True).decode("utf-8")
                  if "secret key" in decoded.lower():
                      print(f"::add-mask::{normalized_key}")
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                          env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={normalized_key}\n")
                  else:
                      print("Warning: TAURI_SIGNING_PRIVATE_KEY does not contain a Tauri updater private key.")
              except Exception as error:
                  print(f"Warning: TAURI_SIGNING_PRIVATE_KEY is not valid Base64: {error}")
          else:
              print("Notice: TAURI_SIGNING_PRIVATE_KEY not set; building unsigned release artifacts.")
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: AI Usage Tracker v__VERSION__
          releaseDraft: false
          prerelease: ${{ steps.release_kind.outputs.is_beta == 'true' }}
          uploadUpdaterJson: true
          args: ""

  build-ios:
    name: Build iOS IPA
    needs: [check-changes, publish-windows]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_apple == 'true'
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      attach_to_versioned_release: true
      release_version: ${{ needs.check-changes.outputs.version }}
