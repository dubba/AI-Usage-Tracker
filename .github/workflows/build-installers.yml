name: Publish desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-trigger

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            apple_signing_identity: ""
          - os: macos-15
            args: ""
            apple_signing_identity: "-"
          - os: macos-15-intel
            args: ""
            apple_signing_identity: "-"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Normalize and verify updater signing key
        shell: python
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64
          import os
          import sys

          raw_key = os.environ.get("RAW_TAURI_SIGNING_PRIVATE_KEY", "")
          normalized_key = "".join(raw_key.lstrip("\ufeff").split())

          if normalized_key:
              try:
                  decoded = base64.b64decode(normalized_key, validate=True).decode("utf-8")
                  if "secret key" in decoded.lower():
                      print(f"::add-mask::{normalized_key}")
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                          env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={normalized_key}\n")
                  else:
                      print("Warning: TAURI_SIGNING_PRIVATE_KEY does not contain a Tauri updater private key.")
              except Exception as error:
                  print(f"Warning: TAURI_SIGNING_PRIVATE_KEY is not valid Base64: {error}")
          else:
              print("Notice: TAURI_SIGNING_PRIVATE_KEY not set; building unsigned release artifacts.")
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: AI Usage Tracker v__VERSION__
          releaseBody: |
            ## Which download should I use?

            ### Windows

            **Recommended for most people: download the file ending in `-setup.exe`.**

            - **`-setup.exe` — recommended:** the normal Windows installer. It installs for your Windows account, usually does not require administrator access, and is the installer used by automatic in-app updates.
            - **`.msi` — administrators and managed computers:** intended for enterprise deployment, system administrators, Group Policy, Intune, or machine-wide installation. It commonly requires administrator access.

            Use one Windows installer type consistently. Installing both the `.exe` and `.msi` can create separate installation contexts.

            ### macOS

            - **Apple Silicon:** choose the macOS download marked `aarch64` or `arm64` for M1, M2, M3, M4, and newer Apple chips.
            - **Intel Mac:** choose the macOS download marked `x64` or `x86_64`.

            ### Android

            - **`.apk` — sideload for Android:** download the `.apk` file directly to your phone (or transfer via USB) and tap to install. Enable "Install unknown apps" for your browser or file manager when prompted.

            ### Files you normally should not download manually

            Files ending in `.sig`, `.tar.gz`, and `latest.json` support automatic updates. They are not the normal installers.

            ## Security warning

            These builds are not yet backed by paid platform code-signing certificates. Windows and macOS may display an unverified-publisher warning. The macOS builds use an ad-hoc signature, so you may need to approve the app in **System Settings → Privacy & Security** after downloading it.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          npx tauri android build --apk
      - name: Sign and Align Android APKs
        shell: bash
        run: |
          mkdir -p release-apks
          # Generate a self-signed release keystore
          keytool -genkeypair -v -keystore release.jks -alias ai-usage-tracker -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=AI Usage Tracker, OU=Mobile, O=AI Usage Tracker, L=Unknown, ST=Unknown, C=US"
          
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Processing and signing $apk..."
            base_name=$(basename "$apk" .apk)
            
            clean_name="AI-Usage-Tracker-$(echo "$base_name" | sed -e 's/app-//' -e 's/-release-unsigned//' -e 's/-unsigned//').apk"
            if [ "$clean_name" = "AI-Usage-Tracker-universal.apk" ] || [ "$clean_name" = "AI-Usage-Tracker-release.apk" ]; then
              clean_name="AI-Usage-Tracker.apk"
            fi
            
            "$ZIPALIGN" -v -p 4 "$apk" "aligned.apk"
            "$APKSIGNER" sign --ks release.jks --ks-pass pass:password --key-pass pass:password --out "release-apks/$clean_name" "aligned.apk"
            "$APKSIGNER" verify --verbose "release-apks/$clean_name"
            rm -f "aligned.apk"
          done
          
          echo "Signed Android packages:"
          ls -la release-apks/
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apks/*.apk
      - name: Read package version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          tag_name: v${{ steps.pkg_version.outputs.version }}
        continue-on-error: true
