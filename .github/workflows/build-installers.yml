name: Publish all platform releases

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if no new commits exist"
        type: boolean
        required: false
        default: false
      include_apple:
        description: "Include macOS and iOS builds"
        type: boolean
        required: false
        default: true
      skip_validate:
        description: "Ship without running the Validate gate (hotfix override)"
        type: boolean
        required: false
        default: false
  # Thursdays & Sundays at 10:30 PM US Eastern, all platforms on both runs. The
  # entries are evaluated in America/New_York, so the times hold through daylight
  # saving changes (10:30 PM is 02:30 UTC the next day in EDT, 03:30 UTC in EST).
  # The starts are kept off the top of the hour because GitHub delays scheduled
  # runs then. GitHub can also drop a scheduled run outright, so each night has a
  # fallback at 11:45 PM Eastern; a scheduled run skips itself when a release was
  # created in the last few hours, so only one of the pair publishes. A late start
  # past midnight is still dated the night before: releaseDateEastern counts
  # anything before 6 AM Eastern as the previous night.
  schedule:
    - cron: '30 22 * * 4' # Thursday 10:30 PM Eastern
      timezone: America/New_York
    - cron: '30 22 * * 0' # Sunday 10:30 PM Eastern
      timezone: America/New_York
    - cron: '45 23 * * 4' # Fallback for Thursday: 11:45 PM Eastern
      timezone: America/New_York
    - cron: '45 23 * * 0' # Fallback for Sunday: 11:45 PM Eastern
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - .github/release-trigger

permissions:
  contents: write

# One release at a time: a scheduled run that starts while another release is
# still building waits for it, then sees that release and skips.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check commits and determine target platforms
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build_apple: ${{ steps.check.outputs.build_apple }}
      version: ${{ steps.version.outputs.version }}
      is_beta: ${{ steps.version.outputs.is_beta }}
      # Taken once, when the run starts, so the release page and the CHANGELOG
      # heading carry the same date however long the builds take.
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch all tags and history to compare
      - name: Inspect commits and schedule day
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force }}
          INPUT_APPLE: ${{ inputs.include_apple }}
          RECENT_RELEASE_MINUTES: "240"
        run: |
          set -euo pipefail

          # Every release builds every platform. A release is tagged at HEAD, so
          # a run that skipped the Apple platforms would leave that version
          # without macOS and iOS builds (and without their updater entries)
          # until a later commit arrives. Only a manual run may opt out.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_APPLE="${INPUT_APPLE:-true}"
          else
            BUILD_APPLE="true"
          fi

          echo "build_apple=$BUILD_APPLE" >> "$GITHUB_OUTPUT"
          echo "Target platforms will include macOS/iOS: $BUILD_APPLE"

          if [ "${FORCE_BUILD:-false}" = "true" ]; then
            echo "Build manually forced via workflow_dispatch input."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Build triggered by explicit push to .github/release-trigger."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The schedule has a primary and a fallback entry per night. Whichever
          # starts second finds the release the first one created and stops.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            LAST_CREATED=$(gh release list --limit 1 --json createdAt -q '.[0].createdAt // ""' 2>/dev/null || true)
            if [ -n "$LAST_CREATED" ]; then
              AGE_MINUTES=$(( ($(date -u +%s) - $(date -u -d "$LAST_CREATED" +%s)) / 60 ))
              if [ "$AGE_MINUTES" -lt "$RECENT_RELEASE_MINUTES" ]; then
                echo "A release was created $AGE_MINUTES minute(s) ago ($LAST_CREATED). Skipping this scheduled run."
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found in repository; proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_COMMIT=$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null || true)
          HEAD_COMMIT=$(git rev-parse HEAD)

          echo "Latest release tag: $LATEST_TAG ($RELEASE_COMMIT)"
          echo "Current HEAD commit: $HEAD_COMMIT"

          if [ -n "$RELEASE_COMMIT" ] && [ "$RELEASE_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "No new commits since $LATEST_TAG. Skipping build to save credits."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The release pipeline itself pushes follow-up commits to main (the
          # SideStore source update and the released version bump). They are
          # not new work, so they must not trigger another release.
          COMMITS_COUNT=$(git rev-list --count --invert-grep \
            --grep='^chore(release): bump version to ' \
            --grep='^chore: update SideStore source for v' \
            "${LATEST_TAG}..HEAD" 2>/dev/null || echo "1")
          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "Zero commits between $LATEST_TAG and HEAD. Skipping build to save credits."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $COMMITS_COUNT new commit(s) since $LATEST_TAG. Proceeding with release build."
          echo "should_build=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.should_build == 'true'
        with:
          node-version: 22
      - name: Resolve release version and beta fallback
        id: version
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/resolve-release-version.mjs --github-output

  # Runs the whole Validate workflow on the commit being released. Every build
  # waits for it, so a commit that fails Validate cannot be published. A manual
  # run can bypass it with skip_validate; the job is then skipped, and the build
  # jobs accept a skipped gate but not a failed or cancelled one.
  validate:
    name: Validate the commit being released
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true' && inputs.skip_validate != true
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      statuses: write
      checks: write

  # Creates the release and its tag at the commit being built, so the platform
  # jobs can start together and each upload as soon as it finishes (tauri-action
  # and the Android and iOS upload steps add to an existing release). The notes go
  # on at creation, so the changelog and download guide show while the builds
  # upload. This is the job the Validate gate guards; every build job needs it.
  create-release:
    name: Create the GitHub release
    needs: [check-changes, validate]
    if: ${{ !cancelled() && needs.check-changes.outputs.should_build == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create the release with its notes unless it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-changes.outputs.version }}
          IS_BETA: ${{ needs.check-changes.outputs.is_beta }}
          RELEASE_DATE: ${{ needs.check-changes.outputs.release_date }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.mjs --version "$VERSION" --date "$RELEASE_DATE" --output "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; the platform jobs add to it."
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            exit 0
          fi
          kind=()
          if [ "$IS_BETA" = true ]; then kind=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AI Usage Tracker $tag" --notes-file "$notes" "${kind[@]}"

  publish-windows:
    name: Build Windows installer
    needs: [check-changes, create-release]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Apply release version
        # Passed through the environment, never pasted into the script. bash,
        # because the Windows default (PowerShell) would not expand "$RELEASE_VERSION",
        # and an empty version makes the script number the build from package.json.
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          node scripts/resolve-release-version.mjs --version "$RELEASE_VERSION" --apply
      - name: Detect beta version
        id: release_kind
        shell: python
        run: |
          import json
          import os

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as config_file:
              version = json.load(config_file)["version"]
          is_beta = "-" in version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"is_beta={'true' if is_beta else 'false'}\n")
      - name: Normalize and verify updater signing key
        shell: python
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64
          import os
          import sys

          # Without a valid key the release would still upload latest.json, which every
          # installed copy refuses, so updates stop until a signed manifest replaces it.
          # Fail before building instead.
          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          raw_key = os.environ.get("RAW_TAURI_SIGNING_PRIVATE_KEY", "")
          normalized_key = "".join(raw_key.lstrip("﻿").split())

          if not normalized_key:
              fail("TAURI_SIGNING_PRIVATE_KEY is not set; refusing to publish an unsigned release.")
          try:
              decoded = base64.b64decode(normalized_key, validate=True).decode("utf-8")
          except Exception:
              fail("TAURI_SIGNING_PRIVATE_KEY is not valid Base64.")
          if "secret key" not in decoded.lower():
              fail("TAURI_SIGNING_PRIVATE_KEY does not contain a Tauri updater private key.")

          print(f"::add-mask::{normalized_key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={normalized_key}\n")
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: AI Usage Tracker v__VERSION__
          releaseDraft: false
          prerelease: ${{ steps.release_kind.outputs.is_beta == 'true' }}
          # latest.json is written once by updater-manifest, after both desktop jobs.
          uploadUpdaterJson: false
          # `-- --locked` reaches cargo: build exactly what Cargo.lock records.
          args: ${{ steps.release_kind.outputs.is_beta == 'true' && '--bundles nsis -- --locked' || '-- --locked' }}

  # Releases are numbered from the tags, not from package.json, so a released
  # version is bumped automatically (0.4.1 -> 0.4.2). Write the number that
  # shipped back to the version files so package.json on main matches the
  # latest release, stamp "## Unreleased" in CHANGELOG.md with the version
  # and release date, and open a fresh empty Unreleased section above it. Failing to push does not fail the release: the next run
  # derives its version from the tags either way.
  commit-version-bump:
    name: Commit released version to main
    needs: [check-changes, create-release]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write the released version back to the version files
        shell: bash
        env:
          VERSION: ${{ needs.check-changes.outputs.version }}
          RELEASE_DATE: ${{ needs.check-changes.outputs.release_date }}
        run: |
          set -euo pipefail
          node scripts/resolve-release-version.mjs --version "$VERSION" --apply --stamp-changelog --date "$RELEASE_DATE"
          if git diff --quiet; then
            echo "Version files and changelog already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "chore(release): bump version to $VERSION"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed version bump to $VERSION."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::warning::Could not push the version bump for $VERSION. Releases still number from tags."

  build-android:
    name: Build Android APK
    needs: [check-changes, create-release]
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      attach_to_versioned_release: true
      release_version: ${{ needs.check-changes.outputs.version }}

  publish-macos:
    name: Build macOS desktop
    needs: [check-changes, create-release]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_apple == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # Only main saves: PR caches count toward the repo's 10 GB and push out
          # the caches release builds restore. PR runs still restore main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Apply release version
        # Passed through the environment, never pasted into the script.
        env:
          RELEASE_VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          node scripts/resolve-release-version.mjs --version "$RELEASE_VERSION" --apply
      - name: Detect beta version
        id: release_kind
        shell: python
        run: |
          import json
          import os

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as config_file:
              version = json.load(config_file)["version"]
          is_beta = "-" in version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"is_beta={'true' if is_beta else 'false'}\n")
      - name: Normalize and verify updater signing key
        shell: python
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64
          import os
          import sys

          # Without a valid key the release would still upload latest.json, which every
          # installed copy refuses, so updates stop until a signed manifest replaces it.
          # Fail before building instead.
          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          raw_key = os.environ.get("RAW_TAURI_SIGNING_PRIVATE_KEY", "")
          normalized_key = "".join(raw_key.lstrip("﻿").split())

          if not normalized_key:
              fail("TAURI_SIGNING_PRIVATE_KEY is not set; refusing to publish an unsigned release.")
          try:
              decoded = base64.b64decode(normalized_key, validate=True).decode("utf-8")
          except Exception:
              fail("TAURI_SIGNING_PRIVATE_KEY is not valid Base64.")
          if "secret key" not in decoded.lower():
              fail("TAURI_SIGNING_PRIVATE_KEY does not contain a Tauri updater private key.")

          print(f"::add-mask::{normalized_key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TAURI_SIGNING_PRIVATE_KEY={normalized_key}\n")
      - name: Configure macOS code signing
        shell: python
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          import os
          import sys

          # Signing without notarization is still blocked by Gatekeeper, so it is
          # all six secrets or none. A partial set fails rather than quietly
          # shipping an ad-hoc build. The values reach tauri-action through
          # GITHUB_ENV, so its step must not set APPLE_SIGNING_IDENTITY itself.
          names = ["APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "APPLE_SIGNING_IDENTITY",
                   "APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID"]
          values = {name: os.environ.get(name, "").strip() for name in names}
          values["APPLE_CERTIFICATE"] = "".join(values["APPLE_CERTIFICATE"].split())
          missing = [name for name in names if not values[name]]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              if len(missing) == len(names):
                  print("::warning::No Apple signing secrets; building ad-hoc signed. Gatekeeper will block first launch.")
                  env_file.write("APPLE_SIGNING_IDENTITY=-\n")
              elif missing:
                  print(f"::error::Apple signing is partly configured; missing {', '.join(missing)}.")
                  sys.exit(1)
              else:
                  for name in names:
                      print(f"::add-mask::{values[name]}")
                      env_file.write(f"{name}={values[name]}\n")
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: AI Usage Tracker v__VERSION__
          releaseDraft: false
          prerelease: ${{ steps.release_kind.outputs.is_beta == 'true' }}
          # latest.json is written once by updater-manifest, after both desktop jobs.
          uploadUpdaterJson: false
          # `-- --locked` reaches cargo: build exactly what Cargo.lock records.
          args: "-- --locked"

  build-ios:
    name: Build iOS IPA
    needs: [check-changes, create-release]
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_apple == 'true'
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      attach_to_versioned_release: true
      release_version: ${{ needs.check-changes.outputs.version }}

  # Writes the desktop updater manifest (latest.json) once, after both desktop
  # jobs, from their bundles and .sig files on the release. Each tauri-action run
  # would otherwise download latest.json, add its platform, and upload it again,
  # and two runs side by side could drop a platform. The app ignores a release
  # until latest.json exists, so desktop users only see the finished release. A
  # platform whose job failed is left out; the other still ships.
  updater-manifest:
    name: Write the desktop updater manifest
    needs: [check-changes, create-release, publish-windows, publish-macos]
    if: ${{ !cancelled() && needs.check-changes.outputs.should_build == 'true' && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build latest.json from the release and upload it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          work=$(mktemp -d)
          gh release view "$tag" --json assets > "$work/assets.json"
          gh release download "$tag" --pattern '*.sig' --dir "$work/sigs"
          node scripts/updater-manifest.mjs --version "$VERSION" --assets "$work/assets.json" \
            --sigs "$work/sigs" --out "$work/latest.json"
          gh release upload "$tag" "$work/latest.json" --clobber

  # The release page is the version's changelog followed by the download guide,
  # generated from CHANGELOG.md and .github/release-notes/download-guide.md.
  # create-release already sets them; this writes them again at the end in case
  # a platform job's tauri-action changed the body, and runs even when a platform
  # failed, so every release ends with its notes.
  release-notes:
    name: Write release notes
    needs: [check-changes, validate, create-release, publish-windows, publish-macos, build-android, build-ios, updater-manifest]
    if: ${{ always() && needs.check-changes.outputs.should_build == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the notes and set them on the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-changes.outputs.version }}
          RELEASE_DATE: ${{ needs.check-changes.outputs.release_date }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs --version "$VERSION" --date "$RELEASE_DATE" --output "$RUNNER_TEMP/release-notes.md"
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
