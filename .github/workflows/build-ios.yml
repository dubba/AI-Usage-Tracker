name: Build iOS IPA for SideStore

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      attach_to_versioned_release:
        description: Attach the IPA to the GitHub Release for this package version
        type: boolean
        required: false
        default: false
      release_version:
        description: Target release version override (e.g. 0.3.17-beta.1)
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Apply release version
        if: ${{ inputs.release_version != '' }}
        shell: bash
        run: |
          node scripts/resolve-release-version.mjs --version "${{ inputs.release_version }}" --apply
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Build iOS IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init
          fi

          # The archive step produces an unsigned .app even when the export step
          # fails for lack of a signing identity, so a non-zero exit is tolerated
          # here and the archive is checked below.
          npx tauri ios build --ci --target aarch64 --export-method debugging \
            || echo "::warning::tauri ios build exited non-zero (expected without signing); looking for the archive"

          find_app() {
            find src-tauri/gen/apple "$RUNNER_TEMP" -maxdepth 8 -type d -path "*.xcarchive/Products/Applications/*.app" 2>/dev/null | head -n 1
          }

          APP_DIR=$(find_app || true)

          if [ -z "$APP_DIR" ]; then
            echo "::warning::No archive found; archiving with xcodebuild and code signing disabled"
            cd src-tauri/gen/apple
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | jq -r '.project.schemes[] | select(endswith("_iOS"))' | head -n 1)
            echo "Using scheme: $SCHEME"
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/app.xcarchive" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            cd ../../..
            APP_DIR=$(find_app || true)
          fi

          if [ -z "$APP_DIR" ]; then
            echo "Error: no iOS .app was produced."
            exit 1
          fi

          echo "Packaging unsigned IPA from $APP_DIR"
          mkdir -p release-ipa/Payload
          cp -R "$APP_DIR" release-ipa/Payload/
          (cd release-ipa && zip -q -r -y AI-Usage-Tracker.ipa Payload && rm -rf Payload)

          # Records the exact IPA byte size; skipped for pre-release versions.
          node scripts/update-sidestore-source.mjs --ipa release-ipa/AI-Usage-Tracker.ipa

          (cd release-ipa && shasum -a 256 AI-Usage-Tracker.ipa > AI-Usage-Tracker.ipa.sha256)
          cp sidestore-source.json release-ipa/sidestore-source.json
          ls -la release-ipa/

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: |
            release-ipa/AI-Usage-Tracker.ipa
            release-ipa/AI-Usage-Tracker.ipa.sha256
            release-ipa/sidestore-source.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: ${{ inputs.attach_to_versioned_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              for file in release-ipa/AI-Usage-Tracker.ipa release-ipa/AI-Usage-Tracker.ipa.sha256 release-ipa/sidestore-source.json; do
                [ -f "$file" ] || continue
                file_name=$(basename "$file")
                gh release upload "$TAG" "${file}#${file_name}" --clobber
              done
              echo "Attached IPA and SideStore source to $TAG"
              exit 0
            fi
            echo "Waiting for release $TAG ($i/20)..."
            sleep 30
          done
          echo "Release $TAG was not created in time; the IPA is available as an Actions artifact."
          exit 1

      - name: Publish SideStore source to main
        if: ${{ inputs.attach_to_versioned_release }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) echo "Pre-release $VERSION: leaving the main SideStore source unchanged."; exit 0 ;;
          esac
          if git diff --quiet -- sidestore-source.json; then
            echo "sidestore-source.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore-source.json
          git commit -m "chore: update SideStore source for v$VERSION"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
